<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="短歌ノートWeb" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:site_name" content="短歌ノートWeb" />
    <meta
      property="og:description"
      content="ブラウザ上で完結する手軽な短歌編集ツールです。"
    />
    <title>プレビュー</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&family=Noto+Sans+JP&family=Yuji+Syuku&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/images/favicon_io/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="../assets/images/favicon_io/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="../assets/css/preview.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"
      integrity="sha512-7tWCgq9tTYS/QkGVyKrtLpqAoMV9XIUxoou+sPUypsaZx56cYR/qio84fPK9EvJJtKvJEwt7vkn6je5UVzGevw=="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="toolbar">
      <div class="toolbar-group">
        <label for="font-select">フォント</label>
        <select id="font-select">
          <option value="'Shippori Mincho', serif">しっぽり明朝 (明朝)</option>
          <option value="'Hiragino Mincho Pro', serif">
            ヒラギノ明朝（明朝）
          </option>
          <option value="'Noto Sans JP', sans-serif">
            Noto Sans (ゴシック)
          </option>
          <option value="'Yuji Syuku', serif">佑字 宿 (筆文字)</option>
          <option value="'Zen Kurenaido', sans-serif">
            Zen 紅道 (手書き風)
          </option>
        </select>
      </div>

      <div class="toolbar-group">
        <label for="bg-color">背景色</label>
        <input type="color" id="bg-color" value="#fcfcfc" />
      </div>

      <div class="toolbar-group">
        <label for="text-color">文字色</label>
        <input type="color" id="text-color" value="#333333" />
      </div>

      <div class="toolbar-group">
        <label for="text-color">ユーザーネーム</label>
        <input
          type="text"
          id="username-input"
          placeholder="作者名を入力（任意）"
        />
      </div>

      <button id="download-btn" class="download-btn">画像をダウンロード</button>
    </div>

    <div class="preview-wrapper">
      <div id="capture-target">
        <div class="tanka-container" id="content-container"></div>
        <div class="display-area">
          <span id="output"></span>
        </div>
      </div>
    </div>

    <script src="../assets/js/preview.js"></script>
  </body>
</html>
