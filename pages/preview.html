<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="短歌ノートWeb" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:site_name" content="短歌ノートWeb" />
    <meta
      property="og:description"
      content="ブラウザ上で完結する手軽な短歌編集ツールです。"
    />
    <title>プレビュー</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&family=Noto+Sans+JP&family=Yuji+Syuku&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/images/favicon_io/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="../assets/images/favicon_io/apple-touch-icon.png"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <style>
      :root {
        --bg-color: #fcfcfc;
        --text-color: #333333;
        --main-font: "Shippori Mincho", serif;
      }

      body {
        background-color: #edf1f2;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        background: #fff;
        padding: 23px 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        z-index: 100;
        margin-top: -8px;
        margin-left: -7px;
        margin-right: -7px;
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
      }

      .toolbar label {
        font-weight: bold;
        color: #555;
      }

      select,
      input[type="color"] {
        cursor: pointer;
        padding: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button.download-btn {
        margin-left: auto;
        background-color: #4a5568;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      button.download-btn:hover {
        background-color: #2d3748;
      }
      /* ボタンが無効化されている時のスタイル */
      button.download-btn:disabled {
        background-color: #999;
        cursor: not-allowed;
      }

      .preview-wrapper {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }

      #capture-target {
        display: flex;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--main-font);
        writing-mode: vertical-rl;

        min-height: 80vh;
        padding: 3rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;

        width: max-content;
        min-width: 300px;
      }

      span#output {
        display: flex;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--main-font);
        writing-mode: horizontal-tb;
        font-size: small;
      }

      #username-input {
        border: solid 1.5px #e2e8f0;
        padding: 8px;
        border-radius: 5px;
      }

      .tanka-container {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        height: 100%;
        gap: 3.5em;
        margin-left: 20px;
      }

      h1 {
        font-size: 1.2rem;
        margin-left: 0.5em;
        margin-bottom: 0;
      }

      .tanka {
        font-size: 1.2rem;
        line-height: 1.8;
        white-space: pre-wrap;
      }

      /* @media (prefers-color-scheme: dark) {
        body {
          background: #2d3748;
        }
        .toolbar {
          background-color: #1a202c;
          box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
        }
        .toolbar label {
          color: #ddd;
        }

        input,
        select {
          background-color: #1a202c;
          color: #ddd;
          border: 1px solid #555;
        }
        #username-input {
          border: solid 0.5px #555;
        }
      } */
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="toolbar-group">
        <label for="font-select">フォント</label>
        <select id="font-select">
          <option value="'Shippori Mincho', serif">しっぽり明朝 (明朝)</option>
          <option value="'Hiragino Mincho Pro', serif">
            ヒラギノ明朝（明朝）
          </option>
          <option value="'Noto Sans JP', sans-serif">
            Noto Sans (ゴシック)
          </option>
          <option value="'Yuji Syuku', serif">佑字 宿 (筆文字)</option>
          <option value="'Zen Kurenaido', sans-serif">
            Zen 紅道 (手書き風)
          </option>
        </select>
      </div>

      <div class="toolbar-group">
        <label for="bg-color">背景色</label>
        <input type="color" id="bg-color" value="#fcfcfc" />
      </div>

      <div class="toolbar-group">
        <label for="text-color">文字色</label>
        <input type="color" id="text-color" value="#333333" />
      </div>

      <div class="toolbar-group">
        <label for="text-color">ユーザーネーム</label>
        <input
          type="text"
          id="username-input"
          placeholder="作者名を入力（任意）"
        />
      </div>

      <button id="download-btn" class="download-btn">画像をダウンロード</button>
    </div>

    <div class="preview-wrapper">
      <div id="capture-target">
        <div class="tanka-container" id="content-container"></div>
        <div class="display-area">
          <span id="output"></span>
        </div>
      </div>
    </div>

    <script>
      /* --- 1. データ読み込み --- */
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get("id");
      const lists = JSON.parse(localStorage.getItem("utayomi_data")) || [];
      const series = lists.find((l) => l.id == targetId);
      const container = document.getElementById("content-container");

      if (series) {
        document.title = series.title + " - プレビュー";
        const titleEl = document.createElement("h1");
        titleEl.textContent = series.title;
        container.appendChild(titleEl);

        series.items.forEach((item) => {
          if (!item.text.trim()) return;
          const p = document.createElement("div");
          p.className = "tanka";
          p.textContent = item.text;
          container.appendChild(p);
        });
      } else if (targetId) {
        container.innerHTML = "<p>データが見つかりませんでした。</p>";
      }

      /* --- 2. 設定変更 --- */
      const root = document.documentElement;
      document
        .getElementById("font-select")
        .addEventListener("change", (e) =>
          root.style.setProperty("--main-font", e.target.value),
        );
      document
        .getElementById("bg-color")
        .addEventListener("input", (e) =>
          root.style.setProperty("--bg-color", e.target.value),
        );
      document
        .getElementById("text-color")
        .addEventListener("input", (e) =>
          root.style.setProperty("--text-color", e.target.value),
        );

      /* --- 3. 画像ダウンロード (html-to-image版) --- */
      document
        .getElementById("download-btn")
        .addEventListener("click", async () => {
          const target = document.getElementById("capture-target");
          const downloadBtn = document.getElementById("download-btn");

          downloadBtn.textContent = "生成中...";
          downloadBtn.disabled = true;

          try {
            // フォントの読み込み完了を待つ（これが原因で止まることがあるため念のため）
            await document.fonts.ready;

            // html-to-image で画像生成
            // pixelRatio: 2 で高解像度化（Retina対応）
            const dataUrl = await htmlToImage.toPng(target, { pixelRatio: 2 });

            const link = document.createElement("a");
            link.download =
              (series ? series.title : "utayomi_preview") + ".png";
            link.href = dataUrl;
            link.click();
          } catch (error) {
            console.error("画像生成エラー:", error);
            alert("画像の生成に失敗しました。\n" + error.message);
          } finally {
            // 成功しても失敗してもボタンを元に戻す
            downloadBtn.textContent = "画像をダウンロード";
            downloadBtn.disabled = false;
          }
        });

      // 1. HTML要素を取得する
      const inputElement = document.getElementById("username-input");
      const outputElement = document.getElementById("output");

      // 2. 入力イベントを監視する
      inputElement.addEventListener("input", () => {
        // 3. 入力された値を表示用の要素に代入する
        outputElement.textContent = inputElement.value;
      });
    </script>
  </body>
</html>
