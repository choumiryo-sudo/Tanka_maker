<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プレビュー - Utayomi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        /* 縦書き設定 */
        writing-mode: vertical-rl;
        font-family: "Shippori Mincho", serif; /* 明朝体 */
        background-color: #fcfcfc; /* 紙っぽい白 */
        color: #333;
        margin: 0;
        padding: 40px;
        height: 100vh; /* 画面いっぱいの高さ */
        box-sizing: border-box;
        overflow-x: auto; /* 横スクロールを許可 */
      }

      /* 全体を包むコンテナ */
      .container {
        display: flex;
        flex-direction: column; /* 縦書きなのでcolumnが横並びになる */
        flex-wrap: wrap;
        height: 90%;
        align-content: flex-start; /* 右寄せ（縦書きの開始位置） */
        gap: 4em; /* 短歌と短歌の間隔 */
      }

      /* タイトルのスタイル */
      h1 {
        font-size: 1.8rem;
        margin-left: 2em; /* タイトルと本文の間の余白 */
        padding-bottom: 10px;
      }

      /* 短歌一首ごとのスタイル */
      .tanka {
        font-size: 1.4rem;
        line-height: 1.8; /* 行間 */
        white-space: pre-wrap; /* 改行をそのまま反映 */
        display: inline-block;
      }

      /* 印刷時の設定（ボタンなどを消すならここで調整） */
      @media print {
        body {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="preview-container"></div>

    <script>
      // 1. URLからIDを取得する
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get("id");

      // 2. LocalStorageからデータを読み込む
      // (script.jsと同じキー "utayomi_data" を見に行きます)
      const lists = JSON.parse(localStorage.getItem("utayomi_data")) || [];

      // 3. IDが一致する作品を探す
      // targetIdは文字列、l.idは数値の可能性があるので "==" で比較
      const series = lists.find((l) => l.id == targetId);

      const container = document.getElementById("preview-container");

      if (series) {
        // タイトルを表示
        document.title = series.title; // ブラウザのタブ名

        // 画面にタイトルを追加
        const titleEl = document.createElement("h1");
        titleEl.textContent = series.title;
        container.appendChild(titleEl);

        // 短歌を一首ずつ追加
        series.items.forEach((item) => {
          // 空の短歌はスキップ
          if (!item.text.trim()) return;

          const p = document.createElement("div");
          p.className = "tanka";
          p.textContent = item.text;
          container.appendChild(p);
        });
      } else {
        container.innerHTML = "<p>データが見つかりませんでした。</p>";
      }
    </script>
  </body>
</html>
